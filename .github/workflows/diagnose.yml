name: Diagnose
on: push
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run suite and publish the first failures as a commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          python -m unittest discover -s tests > /tmp/out.txt 2>&1
          CODE=$?
          grep -E "^(FAIL|ERROR):" /tmp/out.txt | head -3 > /tmp/fails.txt
          SUMMARY=$(head -c 120 /tmp/fails.txt | tr '\n' ' ')
          if [ -z "$SUMMARY" ]; then SUMMARY=$(tail -c 120 /tmp/out.txt | tr '\n' ' '); fi
          python - "$SUMMARY" "$CODE" <<'PY'
          import json, os, sys, urllib.request
          summary, code = sys.argv[1], sys.argv[2]
          body = json.dumps({
              "state": "failure" if code != "0" else "success",
              "context": "diagnose/summary",
              "description": summary[:140] or "no failure text",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/lko47/lumos/statuses/{os.environ['SHA']}",
              data=body,
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
          )
          urllib.request.urlopen(req).read()
          PY
          exit $CODE
