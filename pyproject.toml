[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "lumos-network-mapper"
version = "0.2.0"
description = "A terminal network mapper built on the user's installed Nmap"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lumos = "lumos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
